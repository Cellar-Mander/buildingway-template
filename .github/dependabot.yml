version: 2
updates:
  # Action versions in this repo's own workflows and in the workflows new plugin repos copy.
  # Outside the root, Dependabot reads the workflow files in the listed folder itself.
  - package-ecosystem: github-actions
    directories:
      - /
      - /template/.github/workflows
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
